openapi: 3.0.3
info:
  title: Raizes do Nordeste API
  version: 1.0.0
  description: |
    API Back-end da rede de lanchonetes **Raizes do Nordeste** (matriz + unidades), atendendo
    os canais **APP, TOTEM, BALCAO, PICKUP e WEB**.

    **Fluxo critico (Fluxo A):** `POST /pedidos` -> `POST /pagamentos` (gateway mock) -> `PATCH /pedidos/{id}/status`.

    **Autenticacao:** faca `POST /auth/login` e clique em *Authorize* informando o `accessToken`.
    Usuarios de teste (seed), todos com senha `Senha@123`:
    `admin@raizes.com` (ADMIN), `gerente.recife@raizes.com` (GERENTE, unidade 1),
    `atendente.recife@raizes.com` (ATENDENTE, unidade 1), `cozinha.recife@raizes.com` (COZINHA, unidade 1),
    `gerente.sp@raizes.com` (GERENTE, unidade 2), `maria@cliente.com` e `joao@cliente.com` (CLIENTE).

    **Pagamento mock:** envie `tokenPagamento` = `tok_aprovado` (padrao), `tok_recusado`, `tok_cartao_bloq`,
    `tok_instavel` (falha 1x e aprova no retry) ou `tok_indisponivel` (503).

    **Padrao de erro:** todas as falhas retornam o schema `Erro`
    (`error`, `message`, `details[]`, `timestamp`, `path`, `requestId`).
  contact:
    name: Apollo Hoinatz Bardini - RU 5586086
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:3000
    description: Ambiente local
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login e emissao de token JWT
  - name: Usuarios
    description: Cadastro, perfil e direitos do titular (LGPD)
  - name: Unidades
    description: Unidades da rede e cardapio por unidade
  - name: Produtos
    description: Catalogo central de produtos
  - name: Promocoes
    description: Campanhas e cupons de desconto
  - name: Estoque
    description: Estoque proprio de cada unidade
  - name: Pedidos
    description: Fluxo critico de pedidos multicanal
  - name: Pagamentos
    description: Integracao com gateway externo (mock)
  - name: Fidelidade
    description: Programa de pontos (com consentimento)
  - name: Matriz
    description: Auditoria e relatorios consolidados
  - name: Infra
    description: Saude da aplicacao

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Chave unica (8-64 caracteres, ex. UUID). Reenvios com a mesma chave devolvem o recurso original com status 200 e header `Idempotent-Replayed: true`.'
      schema: { type: string, example: 3f0c2a9e-7d1b-4c61-9a52-2c8e1f7b6d10 }

  schemas:
    Erro:
      type: object
      required: [error, message, details, timestamp, path]
      properties:
        error: { type: string, example: ESTOQUE_INSUFICIENTE }
        message: { type: string, example: Nao ha quantidade suficiente para um ou mais itens. }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: 'itens[0].quantidade' }
              issue: { type: string, example: 'Disponivel: 3' }
        timestamp: { type: string, format: date-time }
        path: { type: string, example: /pedidos }
        requestId: { type: string, format: uuid }
    Meta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 5 }
    CanalPedido:
      type: string
      enum: [APP, TOTEM, BALCAO, PICKUP, WEB]
    StatusPedido:
      type: string
      enum: [AGUARDANDO_PAGAMENTO, PAGAMENTO_RECUSADO, PAGO, EM_PREPARO, PRONTO, ENTREGUE, CANCELADO]
    MetodoPagamento:
      type: string
      enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO, MOCK]
    Perfil:
      type: string
      enum: [CLIENTE, ATENDENTE, COZINHA, GERENTE, ADMIN]

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email, example: maria@cliente.com }
        senha: { type: string, example: Senha@123 }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600 }
        user:
          type: object
          properties:
            id: { type: integer, example: 6 }
            nome: { type: string, example: Maria Cliente }
            perfil: { $ref: '#/components/schemas/Perfil' }
            unidadeId: { type: integer, nullable: true, example: null }

    CadastroUsuario:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string, example: Ana Souza }
        email: { type: string, format: email, example: ana@exemplo.com }
        senha: { type: string, minLength: 8, description: 'Minimo 8 caracteres, com letra e numero.', example: Senha@123 }
        perfil: { $ref: '#/components/schemas/Perfil' }
        unidadeId: { type: integer, description: 'Obrigatorio para ATENDENTE, COZINHA e GERENTE.' }
        consentimentoFidelidade: { type: boolean, default: false, description: Consentimento explicito para o programa de fidelidade (LGPD). }
    Consentimentos:
      type: object
      properties:
        FIDELIDADE:
          type: object
          properties:
            concedido: { type: boolean, example: true }
            versaoTermo: { type: string, example: v1.0-2026 }
            em: { type: string, format: date-time }
        MARKETING:
          type: object
          properties:
            concedido: { type: boolean, example: false }
    Usuario:
      type: object
      description: Nunca inclui senha/senhaHash.
      properties:
        id: { type: integer, example: 8 }
        nome: { type: string, example: Ana Souza }
        email: { type: string, example: ana@exemplo.com }
        perfil: { $ref: '#/components/schemas/Perfil' }
        unidadeId: { type: integer, nullable: true }
        ativo: { type: boolean }
        createdAt: { type: string, format: date-time }
        consentimentos: { $ref: '#/components/schemas/Consentimentos' }

    Unidade:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nome: { type: string, example: Raizes do Nordeste - Recife Boa Viagem }
        cidade: { type: string, example: Recife }
        uf: { type: string, example: PE }
        tipoCozinha: { type: string, enum: [COMPLETA, REDUZIDA] }
        ativa: { type: boolean }
        createdAt: { type: string, format: date-time }
    Cardapio:
      type: object
      properties:
        unidade:
          type: object
          properties:
            id: { type: integer, example: 2 }
            nome: { type: string }
            tipoCozinha: { type: string, example: REDUZIDA }
        itens:
          type: array
          items:
            type: object
            properties:
              produtoId: { type: integer, example: 1 }
              nome: { type: string, example: Tapioca de Carne de Sol com Queijo Coalho }
              categoria: { type: string, example: TAPIOCA }
              preco: { type: number, example: 27.9, description: Preco local da unidade (ou preco base) }
              disponivel: { type: boolean, example: true }
              motivoIndisponibilidade: { type: string, example: Produto sazonal fora do periodo de venda. }
    Produto:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nome: { type: string, example: Tapioca de Carne de Sol com Queijo Coalho }
        descricao: { type: string, nullable: true }
        categoria: { type: string, example: TAPIOCA }
        preco: { type: number, example: 24.9 }
        exigeCozinhaCompleta: { type: boolean }
        sazonal: { type: boolean }
        disponivelDe: { type: string, format: date-time, nullable: true }
        disponivelAte: { type: string, format: date-time, nullable: true }
        ativo: { type: boolean }
    ProdutoInput:
      type: object
      required: [nome, categoria, preco]
      properties:
        nome: { type: string, example: Baiao de Dois }
        descricao: { type: string, example: 'Arroz, feijao verde e queijo coalho' }
        categoria: { type: string, example: PRATO }
        preco: { type: number, example: 29.9 }
        exigeCozinhaCompleta: { type: boolean, example: true }
        sazonal: { type: boolean, example: false }
        disponivelDe: { type: string, format: date-time }
        disponivelAte: { type: string, format: date-time }
    ProdutoUpdate:
      type: object
      description: Atualizacao parcial - informe ao menos um campo.
      properties:
        nome: { type: string }
        descricao: { type: string }
        categoria: { type: string }
        preco: { type: number, example: 26.9 }
        exigeCozinhaCompleta: { type: boolean }
        sazonal: { type: boolean }
        disponivelDe: { type: string, format: date-time }
        disponivelAte: { type: string, format: date-time }
    Promocao:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string, example: APP15 }
        descricao: { type: string }
        percentualDesconto: { type: integer, example: 15 }
        unidadeId: { type: integer, nullable: true }
        canalPedido: { type: string, enum: [APP, TOTEM, BALCAO, PICKUP, WEB], nullable: true }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        ativa: { type: boolean }
    PromocaoInput:
      type: object
      required: [codigo, descricao, percentualDesconto, inicio, fim]
      properties:
        codigo: { type: string, example: JUNINO20 }
        descricao: { type: string, example: 20% no periodo junino }
        percentualDesconto: { type: integer, minimum: 1, maximum: 90, example: 20 }
        unidadeId: { type: integer, example: 1 }
        canalPedido: { $ref: '#/components/schemas/CanalPedido' }
        inicio: { type: string, format: date-time, example: '2026-06-01T00:00:00Z' }
        fim: { type: string, format: date-time, example: '2026-06-30T23:59:59Z' }

    SaldoEstoque:
      type: object
      properties:
        unidadeId: { type: integer, example: 1 }
        itens:
          type: array
          items:
            type: object
            properties:
              produtoId: { type: integer }
              nome: { type: string }
              quantidade: { type: integer, example: 48 }
              precoLocal: { type: number, nullable: true }
              atualizadoEm: { type: string, format: date-time }
    MovimentacaoInput:
      type: object
      required: [unidadeId, produtoId, tipo, quantidade]
      properties:
        unidadeId: { type: integer, example: 1 }
        produtoId: { type: integer, example: 4 }
        tipo: { type: string, enum: [ENTRADA, SAIDA] }
        quantidade: { type: integer, minimum: 1, example: 20 }
        motivo: { type: string, example: Reposicao semanal }
    Movimentacao:
      type: object
      properties:
        movimentacaoId: { type: integer, example: 15 }
        unidadeId: { type: integer, example: 1 }
        produtoId: { type: integer, example: 4 }
        tipo: { type: string, example: ENTRADA }
        quantidade: { type: integer, example: 20 }
        saldoAtual: { type: integer, example: 23 }
        motivo: { type: string }
        createdAt: { type: string, format: date-time }

    CriarPedido:
      type: object
      required: [canalPedido, unidadeId, itens, formaPagamento]
      properties:
        canalPedido: { $ref: '#/components/schemas/CanalPedido' }
        unidadeId: { type: integer, example: 1 }
        clienteId: { type: integer, description: 'Usado pelo ATENDENTE (BALCAO) para identificar o cliente. Para CLIENTE e inferido do token.' }
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [produtoId, quantidade]
            properties:
              produtoId: { type: integer, example: 1 }
              quantidade: { type: integer, minimum: 1, maximum: 50, example: 2 }
        formaPagamento: { $ref: '#/components/schemas/MetodoPagamento' }
        codigoPromocao: { type: string, example: APP15 }
        usarPontos: { type: integer, minimum: 0, description: 'Pontos de fidelidade a resgatar (1 ponto = R$ 0,10; max. 50% do pedido). Exige consentimento.', example: 50 }
        observacao: { type: string, example: Sem cebola }
      example:
        canalPedido: APP
        unidadeId: 1
        itens:
          - { produtoId: 1, quantidade: 2 }
          - { produtoId: 3, quantidade: 1 }
        formaPagamento: PIX
    Pedido:
      type: object
      properties:
        pedidoId: { type: integer, example: 1 }
        canalPedido: { $ref: '#/components/schemas/CanalPedido' }
        status: { $ref: '#/components/schemas/StatusPedido' }
        unidadeId: { type: integer, example: 1 }
        clienteId: { type: integer, nullable: true, example: 6 }
        atendenteId: { type: integer, nullable: true }
        formaPagamento: { $ref: '#/components/schemas/MetodoPagamento' }
        itens:
          type: array
          items:
            type: object
            properties:
              produtoId: { type: integer, example: 1 }
              nome: { type: string, example: Tapioca de Carne de Sol com Queijo Coalho }
              quantidade: { type: integer, example: 2 }
              precoUnitario: { type: number, example: 24.9 }
              subtotal: { type: number, example: 49.8 }
        subtotal: { type: number, example: 59.7 }
        descontoPromocao: { type: number, example: 0 }
        descontoPontos: { type: number, example: 0 }
        pontosResgatados: { type: integer, example: 0 }
        total: { type: number, example: 59.7 }
        codigoPromocao: { type: string, nullable: true }
        observacao: { type: string, nullable: true }
        motivoCancelamento: { type: string, nullable: true }
        historicoStatus:
          type: array
          items:
            type: object
            properties:
              de: { type: string, nullable: true }
              para: { type: string, example: AGUARDANDO_PAGAMENTO }
              usuarioId: { type: integer }
              observacao: { type: string, nullable: true }
              em: { type: string, format: date-time }
        pagamentos:
          type: array
          items: { $ref: '#/components/schemas/Pagamento' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AtualizarStatus:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/StatusPedido' }
        observacao: { type: string }
      example: { status: EM_PREPARO }

    SolicitarPagamento:
      type: object
      required: [pedidoId]
      properties:
        pedidoId: { type: integer, example: 1 }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        tokenPagamento:
          type: string
          description: Token de teste do gateway mock.
          enum: [tok_aprovado, tok_recusado, tok_cartao_bloq, tok_instavel, tok_indisponivel]
          example: tok_aprovado
    Pagamento:
      type: object
      properties:
        id: { type: integer, example: 1 }
        pedidoId: { type: integer, example: 1 }
        status: { type: string, enum: [APROVADO, RECUSADO, ERRO, ESTORNADO] }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        valor: { type: number, example: 59.7 }
        tentativa: { type: integer, example: 1 }
        transacaoExternaId: { type: string, example: mock_txn_8744667b-a3e6-4dc1-a7f5-91fbfc009e20 }
        codigoRetorno: { type: string, example: APROVADO }
        mensagem: { type: string, example: Pagamento aprovado. }
        respostaGateway: { type: object, description: Payload bruto devolvido pelo gateway (registrado para auditoria). }
        createdAt: { type: string, format: date-time }
    ResultadoPagamento:
      type: object
      properties:
        pagamento: { $ref: '#/components/schemas/Pagamento' }
        pedido:
          type: object
          properties:
            pedidoId: { type: integer, example: 1 }
            status: { $ref: '#/components/schemas/StatusPedido' }
        pontosCreditados: { type: integer, example: 59 }
        chamadasGateway: { type: integer, example: 1 }
        reutilizado: { type: boolean, example: false }

  responses:
    '400':
      description: JSON malformado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { error: REQUISICAO_INVALIDA, message: JSON malformado no corpo da requisicao., details: [], timestamp: '2026-11-09T12:00:00Z', path: /pedidos, requestId: 2af099bd-a786-436c-8154-7240b9f7f431 }
    '401':
      description: Nao autenticado (token ausente, invalido ou expirado)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { error: TOKEN_AUSENTE, message: 'Envie o header Authorization: Bearer <token>.', details: [], timestamp: '2026-11-09T12:00:00Z', path: /pedidos, requestId: 2af099bd-a786-436c-8154-7240b9f7f431 }
    '403':
      description: Perfil sem permissao
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { error: ACESSO_NEGADO, message: 'Requer perfil: ADMIN.', details: [], timestamp: '2026-11-09T12:00:00Z', path: /produtos, requestId: 2af099bd-a786-436c-8154-7240b9f7f431 }
    '404':
      description: Recurso nao encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example: { error: PEDIDO_NAO_ENCONTRADO, message: Pedido nao encontrado(a)., details: [], timestamp: '2026-11-09T12:00:00Z', path: /pedidos/999, requestId: 2af099bd-a786-436c-8154-7240b9f7f431 }
    '409':
      description: Conflito com regra de negocio / estado atual
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    '422':
      description: Erro de validacao do contrato
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            error: VALIDACAO
            message: Um ou mais campos sao invalidos.
            details:
              - { field: canalPedido, issue: canalPedido e obrigatorio. }
              - { field: 'itens[0].quantidade', issue: Deve ser maior que zero. }
            timestamp: '2026-11-09T12:00:00Z'
            path: /pedidos
            requestId: 2af099bd-a786-436c-8154-7240b9f7f431

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      tags: [Infra]
      summary: Verifica se a API e o banco estao no ar (health check)
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: { status: UP, banco: UP, timestamp: '2026-11-09T12:00:00Z' }
        '503': { description: Banco indisponivel }

  /auth/login:
    post:
      operationId: postAuthLogin
      security: []
      tags: [Auth]
      summary: Autentica o usuario e retorna um token JWT
      description: Publico. Limitado a 20 tentativas por IP a cada 15 minutos (429). Falhas e sucessos sao auditados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Credenciais invalidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example: { error: CREDENCIAIS_INVALIDAS, message: E-mail ou senha invalidos., details: [], timestamp: '2026-11-09T12:00:00Z', path: /auth/login, requestId: 2af099bd-a786-436c-8154-7240b9f7f431 }
        '422': { $ref: '#/components/responses/422' }
        '429': { description: Muitas tentativas, content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } } }

  /usuarios:
    post:
      operationId: postUsuarios
      tags: [Usuarios]
      summary: Cadastra usuario (CLIENTE publico; funcionarios apenas por ADMIN)
      description: Sem token cria um CLIENTE. Com token ADMIN permite perfis ATENDENTE, COZINHA, GERENTE (exigem unidadeId) e ADMIN. O consentimento de fidelidade e registrado com a versao do termo.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroUsuario' }
      responses:
        '201':
          description: Criado
          content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: E-mail ja cadastrado
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' }, example: { error: EMAIL_JA_CADASTRADO, message: Ja existe um usuario com este e-mail., details: [{ field: email, issue: Em uso. }], timestamp: '2026-11-09T12:00:00Z', path: /usuarios } } }
        '422': { $ref: '#/components/responses/422' }
    get:
      operationId: getUsuarios
      tags: [Usuarios]
      summary: Lista usuarios (e-mail mascarado) - ADMIN
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: perfil, in: query, schema: { $ref: '#/components/schemas/Perfil' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Usuario' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
  /usuarios/me:
    get:
      operationId: getUsuariosMe
      tags: [Usuarios]
      summary: Dados do usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Usuario' } } } }
        '401': { $ref: '#/components/responses/401' }
    delete:
      operationId: deleteUsuariosMe
      tags: [Usuarios]
      summary: Eliminacao dos dados pessoais por anonimizacao (LGPD art. 18, VI) - CLIENTE
      description: Substitui nome/e-mail, invalida a senha e desativa a conta. Pedidos sao mantidos (obrigacao fiscal) sem identificar o titular. O token deixa de valer imediatamente.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Anonimizado }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
  /usuarios/me/dados:
    get:
      operationId: getUsuariosMeDados
      tags: [Usuarios]
      summary: Exporta todos os dados pessoais do titular (LGPD art. 18, II e V)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dados do titular
          content:
            application/json:
              example:
