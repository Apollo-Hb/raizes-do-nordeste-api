  /pagamentos:
    post:
      operationId: postPagamentos
      tags: [Pagamentos]
      summary: Solicita pagamento ao gateway externo (mock) e atualiza o status do pedido
      description: |
        A API **nao processa** o pagamento: envia a solicitacao ao gateway, registra o retorno (payload completo) e atualiza o pedido.
        - Aprovado -> pagamento APROVADO, pedido **PAGO**, pontos creditados (se houver consentimento).
        - Recusado -> pagamento RECUSADO, pedido **PAGAMENTO_RECUSADO** (permite nova tentativa ou cancelamento). Retorna 201 porque a tentativa foi registrada; o resultado esta em `pagamento.status`.
        - Gateway fora do ar -> ate 3 chamadas com backoff exponencial; persistindo, registra ERRO e retorna **503** (pedido segue AGUARDANDO_PAGAMENTO).
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SolicitarPagamento' } } }
      responses:
        '201':
          description: Tentativa registrada (aprovada ou recusada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoPagamento' }
              examples:
                aprovado:
                  value:
                    pagamento: { id: 1, pedidoId: 1, status: APROVADO, metodo: PIX, valor: 59.7, tentativa: 1, transacaoExternaId: mock_txn_8744667b, codigoRetorno: APROVADO, mensagem: Pagamento aprovado., respostaGateway: { status: approved, authorization_code: '860055', pix_e2e_id: E1794234127393MOCK } }
                    pedido: { pedidoId: 1, status: PAGO }
                    pontosCreditados: 59
                    chamadasGateway: 1
                    reutilizado: false
                recusado:
                  value:
                    pagamento: { id: 2, pedidoId: 2, status: RECUSADO, metodo: PIX, valor: 59.7, tentativa: 1, transacaoExternaId: mock_txn_1a2b, codigoRetorno: SALDO_INSUFICIENTE, mensagem: 'Pagamento recusado pelo emissor: saldo ou limite insuficiente.', respostaGateway: { status: declined, decline_code: insufficient_funds } }
                    pedido: { pedidoId: 2, status: PAGAMENTO_RECUSADO }
                    pontosCreditados: 0
                    chamadasGateway: 1
                    reutilizado: false
        '200': { description: Reenvio idempotente - devolve a tentativa original }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: Pedido ja pago ou cancelado
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' }, example: { error: PEDIDO_JA_PAGO, message: Pedido em status ENTREGUE ja possui pagamento aprovado., details: [], timestamp: '2026-11-09T12:00:00Z', path: /pagamentos } } }
        '422': { $ref: '#/components/responses/422' }
        '503':
          description: Gateway indisponivel apos as tentativas
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' }, example: { error: GATEWAY_PAGAMENTO_INDISPONIVEL, message: 'Gateway de pagamento indisponivel apos 3 tentativas. O pedido segue aguardando pagamento; tente novamente.', details: [], timestamp: '2026-11-09T12:00:00Z', path: /pagamentos } } }
  /pagamentos/{id}:
    get:
      operationId: getPagamentosId
      tags: [Pagamentos]
      summary: Consulta uma tentativa de pagamento
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pagamento' } } } }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }

