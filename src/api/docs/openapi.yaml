        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
  /pedidos/{id}/status:
    patch:
      operationId: patchPedidosIdStatus
      tags: [Pedidos]
      summary: Atualiza status operacional (cozinha -> pronto -> entregue)
      description: |
        Transicoes: PAGO -> EM_PREPARO (COZINHA/GERENTE/ADMIN); EM_PREPARO -> PRONTO (COZINHA/GERENTE/ADMIN);
        PRONTO -> ENTREGUE (ATENDENTE/GERENTE/ADMIN). PAGO/PAGAMENTO_RECUSADO sao definidos pelo pagamento e CANCELADO pela rota de cancelamento.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AtualizarStatus' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Pedido' } } } }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404': { $ref: '#/components/responses/404' }
        '409':
          description: Transicao invalida
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' }, example: { error: TRANSICAO_STATUS_INVALIDA, message: Nao e permitido alterar o pedido de PAGAMENTO_RECUSADO para PRONTO., details: [{ field: status, issue: 'Transicoes permitidas a partir de PAGAMENTO_RECUSADO: nenhuma' }], timestamp: '2026-11-09T12:00:00Z', path: /pedidos/2/status } } }
        '422': { $ref: '#/components/responses/422' }
