      tags: [Pedidos]
      summary: Cancela pedido (devolve estoque, estorna pontos e pagamento) - auditado
      description: CLIENTE/ATENDENTE cancelam antes do pagamento aprovado; GERENTE/ADMIN tambem apos pago (gera estorno no gateway).
