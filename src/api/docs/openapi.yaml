      description: |
        Perfis: CLIENTE (canais APP, TOTEM, PICKUP, WEB), ATENDENTE (BALCAO), GERENTE/ADMIN.
        **canalPedido e obrigatorio.** O estoque e reservado (baixa condicional atomica) e devolvido se o pedido for cancelado.
        Ordem de calculo: subtotal -> promocao (%) -> pontos (max. 50%). Status inicial: AGUARDANDO_PAGAMENTO.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CriarPedido' } } }
      responses:
        '201':
          description: Pedido criado (header Location)
          content: { application/json: { schema: { $ref: '#/components/schemas/Pedido' } } }
        '200': { description: Reenvio idempotente - devolve o pedido original }
        '400': { $ref: '#/components/responses/400' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '404':
          description: Unidade, produto ou cliente inexistente
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' }, example: { error: PRODUTO_NAO_ENCONTRADO, message: Produto nao encontrado(a)., details: [{ field: 'itens[0].produtoId', issue: Produto 9999 nao encontrado. }], timestamp: '2026-11-09T12:00:00Z', path: /pedidos } } }
        '409':
          description: Estoque insuficiente
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' }, example: { error: ESTOQUE_INSUFICIENTE, message: Nao ha quantidade suficiente para um ou mais itens., details: [{ field: 'itens[0].quantidade', issue: 'Disponivel: 3' }], timestamp: '2026-11-09T12:00:00Z', path: /pedidos } } }
        '422':
          description: 'Validacao (VALIDACAO) ou regra de negocio: PRODUTO_INDISPONIVEL, CANAL_INVALIDO_PARA_PERFIL, PROMOCAO_INVALIDA, CONSENTIMENTO_NECESSARIO, SALDO_PONTOS_INSUFICIENTE'
          content: { application/json: { schema: { $ref: '#/components/schemas/Erro' } } }
    get:
      operationId: getPedidos
      tags: [Pedidos]
      summary: Lista pedidos com filtros (canal, status, unidade, periodo) e paginacao
      description: CLIENTE ve apenas os proprios; funcionarios veem a propria unidade; ADMIN ve toda a rede.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: canalPedido, in: query, schema: { $ref: '#/components/schemas/CanalPedido' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusPedido' } }
        - { name: unidadeId, in: query, schema: { type: integer } }
        - { name: dataInicio, in: query, schema: { type: string, format: date-time } }
        - { name: dataFim, in: query, schema: { type: string, format: date-time } }
        - { name: ordem, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Pedido' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/401' }
        '403': { $ref: '#/components/responses/403' }
        '422': { $ref: '#/components/responses/422' }
